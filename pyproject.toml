[project]
name = "coursepilot"
version = "0.1.0"
description = "AI Teaching Assistant Agent for CS courses"
requires-python = ">=3.12"
dependencies = [
    # Web 服务
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "python-multipart>=0.0.18,<1",
    "python-dotenv>=1.0,<2",
    # 数据校验/配置
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    # 数据库/迁移
    "sqlalchemy>=2.0,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3,<4",
    # 认证
    "passlib[bcrypt]>=1.7,<2",
    "python-jose[cryptography]>=3.3,<4",
    "bcrypt<4.1",  # passlib 1.7 与 bcrypt 4.1+ 不兼容
    # LLM 框架
    "openai>=1.0,<3",
    "langchain>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langchain-community>=0.4,<1",
    "langchain-text-splitters>=1.0,<2",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-postgres>=3,<4",
    "instructor>=1.0,<2",
    # 模型/向量化
    "transformers>=4.40,<5",
    "sentence-transformers>=3.0,<4",
    "FlagEmbedding>=1.2,<2",
    "accelerate>=1.0,<2",
    "peft>=0.10,<1",
    "torch>=2.10",
    "torchvision>=0.20",
    # 向量库/检索
    "pymilvus>=3.0,<4",
    "milvus-lite>=3.0,<4",
    "faiss-cpu>=1.7,<2",
    "rank-bm25>=0.2,<1",
    # 文档解析
    "PyMuPDF>=1.24.9,<1.25",  # magic-pdf 要求 <1.25
    "python-docx>=1.1,<2",
    "pdfminer.six>=20231228",
    "pdftext>=0.5,<1",
    "pypdf>=4.0,<7",
    "mammoth>=1.6,<2",
    "openpyxl>=3.1,<4",
    "paddleocr>=3.0,<4",
    "magic-pdf>=1.3,<2",
    "mineru>=3.3,<4",
    "ftfy>=6.0,<7",          # MinerU Unimernet 模型运行时依赖
    # 中文处理
    "jieba>=0.42,<1",
    # 数据处理
    "pandas>=2.0,<3",
    "numpy>=1.26,<3",
    # 评测
    "ragas>=0.4,<1",
    # 工具
    "tiktoken>=0.5,<1",
    "httpx>=0.28,<1",
    "requests>=2.31,<3",
    "beautifulsoup4>=4.12,<5",
    "loguru>=0.7,<1",
    "rich>=13.0,<15",
    "streamlit>=1.40,<2",
    "mcp>=2.0.0",
]

[project.scripts]
# 安装后可用 `coursepilot-mcp` 命令启动 stdio 桥接器
coursepilot-mcp = "coursepilot.mcp.cli.main:main"

[tool.setuptools.packages.find]
# src 布局包发现，使 [project.scripts] 入口能正确定位 coursepilot 包
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.25,<1",
    "pytest-cov>=6,<7",
    "ruff>=0.9,<1",
    "mypy>=1.15,<2",
    "pre-commit>=4,<5",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = "-p no:phoenix -p no:pydantic_ai"
markers = [
    "e2e: 端到端测试（全 mock 外部依赖）",
]

[tool.uv]
# magic-pdf 声明 pydantic<2.11，而 mcp 2.0 需 pydantic>=2.12，元数据冲突。
# 实测 pydantic 2.13 下 magic-pdf 可正常运行，故全局放开 pydantic 上限。
override-dependencies = ["pydantic>=2.12,<3"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
